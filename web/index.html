<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotLoL</title>
  <link rel="icon" href="img/logo.png">
  <meta name="description" content="League of Legends tier list, builds, runes, matchups, ARAM, Mayhem and Arena.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cards.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#/" aria-label="NotLoL"><img class="logo" src="img/logo.png" alt=""></a>
    <!-- Hry: NotLoL přepne sám podle toho, co běží -->
    <div class="games" role="tablist">
      <button class="game-btn" type="button" data-game="lol" title="League of Legends" aria-label="League of Legends">
        <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="gLol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0e6d2"/><stop offset="1" stop-color="#c89b3c"/></linearGradient></defs>
          <path d="M20 2 36 11v18L20 38 4 29V11z" fill="#0b1520" stroke="url(#gLol)" stroke-width="2.4"/>
          <path d="M14 10h5v16h9v4H14z" fill="url(#gLol)"/></svg>
        <span>LoL</span>
      </button>
      <button class="game-btn" type="button" data-game="deadlock" title="Deadlock" aria-label="Deadlock">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <rect x="3" y="3" width="34" height="34" rx="5" fill="#142422" stroke="#d9c58a" stroke-width="2.4"/>
          <path d="M11 11h8a9 9 0 0 1 0 18h-8zm4.5 4v10h3a5 5 0 0 0 0-10z" fill="#d9c58a"/>
          <path d="M27 11h3.5v14H35v4h-8z" fill="#7fbfb1"/></svg>
        <span>Deadlock</span>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#/" aria-label="NotLoL">Not<span>LoL</span></a>
      <div class="search">
        <span class="search-ico" data-icon="search"></span>
        <input id="globalSearch" class="input" type="search" data-i18n-ph="search.placeholder" data-i18n-aria="search.aria" autocomplete="off" spellcheck="false">
        <kbd class="search-kbd">/</kbd>
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <div class="top-right">
        <label class="patch"><span data-i18n="patch"></span><select id="patchSelect" aria-label="Patch"></select></label>
        <button id="updateChip" class="update-chip" type="button" data-icon="download" hidden><span id="updateChipText"></span></button>
        <a id="clientChip" class="client-chip" href="#/settings" hidden><span class="dot"></span><span id="clientText"></span></a>
        <a id="meChip" class="me-chip" hidden></a>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <footer class="footer"><p id="footerText"></p></footer>

  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/players.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/deadlock.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
