# Vydání nové verze NotLoL: sestaví appku, zabalí instalátor (Velopack) a nahraje release na GitHub.
# Nainstalované appky si novou verzi samy stáhnou (AppUpdater.cs kontroluje releasy tohohle repa,
# takže repo musí být veřejné).
#
# Spuštění – stačí jedno z toho:
#   - GitHub → Actions → Release → Run workflow → zadej verzi (např. 1.2.0) a případně co je nového
#   - nebo tag: git tag v1.2.0 && git push origin v1.2.0
# Každá verze musí být vyšší než ta minulá.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Verze, např. 1.2.0 (vyšší než minulá)'
        required: true
      notes:
        description: 'Co je nového (nepovinné, ukáže se u releasu)'
        required: false

permissions:
  contents: write

concurrency:
  group: release

env:
  VPK_VERSION: '1.2.161'  # stejná verze jako balíček Velopack v NotLoL.csproj
  PACK_ID: NotLoLApp      # NEMĚNIT – podle něj nainstalované appky poznají své aktualizace

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verze
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Neplatná verze '$v' – použij formát 1.2.0" }
          "VERSION=$v" >> $env:GITHUB_ENV
          # 1.3.0-beta.1 = předběžná verze: na GitHubu jako pre-release, nainstalované appky ji ignorují
          if ($v.Contains('-')) { "VPK_PRE=--pre" >> $env:GITHUB_ENV }
          Set-Content -Path notes.md -Encoding utf8 -Value ($(if ($env:INPUT_NOTES) { $env:INPUT_NOTES } else { "NotLoL $v" }))

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Sestavení
        run: dotnet publish NotLoL.csproj -c Release -o publish -p:Version=${{ env.VERSION }} -nologo

      - name: Velopack (vpk)
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Minulá verze (kvůli malým rozdílovým aktualizacím)
        continue-on-error: true  # u prvního vydání ještě žádná není
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      - name: Instalátor a balíčky
        run: >-
          vpk pack -r win-x64 -u ${{ env.PACK_ID }} -v ${{ env.VERSION }} -p publish -e NotLoL.exe -o releases
          --packTitle NotLoL --packAuthors NotTerraCZ -i app.ico --releaseNotes notes.md
          --framework net10.0-x64-desktop,webview2

      - name: Nahrání na GitHub Releases
        run: >-
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          -o releases --publish --merge --tag v${{ env.VERSION }} --releaseName "NotLoL ${{ env.VERSION }}"
          --targetCommitish ${{ github.sha }} ${{ env.VPK_PRE }}

      # Stálý odkaz pro lidi: https://github.com/<repo>/releases/latest/download/NotLoL-Setup.exe
      - name: Instalátor pod názvem NotLoL-Setup.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item "releases/${{ env.PACK_ID }}-win-Setup.exe" NotLoL-Setup.exe
          gh release upload "v${{ env.VERSION }}" NotLoL-Setup.exe --clobber --repo ${{ github.repository }}
